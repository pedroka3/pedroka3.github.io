<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Capa provisória do projeto Vértice TI. Fontes do sistema:
       SVG via <img> não carrega Google Fonts. -->
  <defs>
    <linearGradient id="v-fundo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12283F"/>
      <stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <filter id="v-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#v-fundo)"/>
  <ellipse cx="180" cy="80" rx="340" ry="230" fill="#1263D2" opacity="0.45" filter="url(#v-blur)"/>
  <ellipse cx="1060" cy="620" rx="300" ry="200" fill="#06B6D4" opacity="0.24" filter="url(#v-blur)"/>

  <!-- símbolo: vértice com nós -->
  <g transform="translate(96,84) scale(2.1)">
    <path d="M6 24 16 6l10 18" stroke="#1263D2" stroke-width="2.6" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="6" r="3.6" fill="#06B6D4"/>
    <circle cx="6" cy="24" r="3.1" fill="#1263D2"/>
    <circle cx="26" cy="24" r="3.1" fill="#1263D2"/>
  </g>

  <text x="180" y="132" font-family="system-ui, 'Segoe UI', sans-serif" font-size="34"
        font-weight="700" fill="#FFFFFF" letter-spacing="-1">Vértice<tspan fill="#06B6D4">TI</tspan></text>

  <text x="96" y="288" font-family="system-ui, 'Segoe UI', sans-serif" font-size="62"
        font-weight="700" fill="#FFFFFF" letter-spacing="-2">Landing page de captação</text>
  <text x="96" y="360" font-family="system-ui, 'Segoe UI', sans-serif" font-size="62"
        font-weight="700" fill="#06B6D4" letter-spacing="-2">com teste A/B instrumentado</text>

  <rect x="96" y="404" width="96" height="4" rx="2" fill="#1263D2"/>

  <text x="96" y="466" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26"
        fill="rgba(255,255,255,0.74)">Duas hipóteses escritas antes de medir, SEO técnico e camada de CRO visível</text>

  <!-- as duas variantes -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="96" y="518" width="270" height="76" rx="9" fill="rgba(255,255,255,0.07)" stroke="#1263D2"/>
    <text x="120" y="548" font-size="17" font-weight="700" fill="#06B6D4" letter-spacing="2">VARIANTE A</text>
    <text x="120" y="576" font-size="19" fill="rgba(255,255,255,0.82)">parte da dor</text>

    <rect x="386" y="518" width="270" height="76" rx="9" fill="rgba(255,255,255,0.07)" stroke="#1263D2"/>
    <text x="410" y="548" font-size="17" font-weight="700" fill="#06B6D4" letter-spacing="2">VARIANTE B</text>
    <text x="410" y="576" font-size="19" fill="rgba(255,255,255,0.82)">parte do preço</text>
  </g>

  <text x="96" y="638" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18"
        fill="rgba(255,255,255,0.45)" letter-spacing="2">PROJETO FICTÍCIO · ESTUDO DE CASO</text>
</svg>
