<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Capa provisória do projeto Encontro Tech Campinas.
       Fontes do sistema: SVG via <img> não carrega Google Fonts. -->
  <defs>
    <linearGradient id="e-fundo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#150C2B"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <linearGradient id="e-neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4F82A"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F43F8E"/>
    </linearGradient>
    <filter id="e-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="85"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#e-fundo)"/>
  <ellipse cx="250" cy="110" rx="340" ry="230" fill="#8B5CF6" opacity="0.5" filter="url(#e-blur)"/>
  <ellipse cx="1000" cy="120" rx="270" ry="180" fill="#22D3EE" opacity="0.28" filter="url(#e-blur)"/>
  <ellipse cx="650" cy="640" rx="380" ry="200" fill="#F43F8E" opacity="0.24" filter="url(#e-blur)"/>

  <rect x="96" y="82" width="44" height="44" rx="11" fill="url(#e-neon)"/>
  <text x="158" y="114" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30"
        font-weight="700" fill="#F5F3FF">Encontro<tspan fill="#C4F82A">Tech</tspan></text>

  <text x="96" y="272" font-family="system-ui, 'Segoe UI', sans-serif" font-size="66"
        font-weight="700" fill="#F5F3FF" letter-spacing="-2">Site de evento em</text>
  <text x="96" y="348" font-family="system-ui, 'Segoe UI', sans-serif" font-size="66"
        font-weight="700" fill="url(#e-neon)" letter-spacing="-2">HTML, CSS e JavaScript</text>

  <rect x="96" y="392" width="96" height="4" rx="2" fill="#C4F82A"/>

  <text x="96" y="452" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26"
        fill="rgba(245,243,255,0.72)">Contagem regressiva, galeria com lightbox e agenda em abas com padrão ARIA</text>

  <!-- contagem regressiva -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <g>
      <rect x="96"  y="504" width="112" height="96" rx="12" fill="#14121F" stroke="#2A2540"/>
      <text x="152" y="562" font-size="40" font-weight="700" fill="#F5F3FF" text-anchor="middle">42</text>
      <text x="152" y="586" font-size="14" fill="#8F87B0" text-anchor="middle" letter-spacing="2">DIAS</text>
    </g>
    <g>
      <rect x="220" y="504" width="112" height="96" rx="12" fill="#14121F" stroke="#2A2540"/>
      <text x="276" y="562" font-size="40" font-weight="700" fill="#F5F3FF" text-anchor="middle">07</text>
      <text x="276" y="586" font-size="14" fill="#8F87B0" text-anchor="middle" letter-spacing="2">HORAS</text>
    </g>
    <g>
      <rect x="344" y="504" width="112" height="96" rx="12" fill="#14121F" stroke="#2A2540"/>
      <text x="400" y="562" font-size="40" font-weight="700" fill="#F5F3FF" text-anchor="middle">19</text>
      <text x="400" y="586" font-size="14" fill="#8F87B0" text-anchor="middle" letter-spacing="2">MIN</text>
    </g>
    <g>
      <rect x="468" y="504" width="112" height="96" rx="12" fill="#14121F" stroke="#C4F82A"/>
      <text x="524" y="562" font-size="40" font-weight="700" fill="#C4F82A" text-anchor="middle">53</text>
      <text x="524" y="586" font-size="14" fill="#8F87B0" text-anchor="middle" letter-spacing="2">SEG</text>
    </g>
  </g>

  <text x="96" y="644" font-family="system-ui, 'Segoe UI', sans-serif" font-size="18"
        fill="rgba(245,243,255,0.42)" letter-spacing="2">PROJETO FICTÍCIO · ESTUDO DE CASO</text>
</svg>
